name: '🐛 Bug Report'
description: 'Report a structural error, linting failure, or algorithmic anomaly'
body:
  - type: markdown
    attributes:
      value: '### Enterprise Bug Tracking Protocol'

  - type: textarea
    id: description
    attributes:
      label: 'Vulnerability or Error Description'
      placeholder: 'Provide a detailed summary of the misbehavior observed...'
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 'Reproduction Steps'
      placeholder: "1. Run pnpm run ci:local:all\n2. Observe console trace..."
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 'Environment Context'
      placeholder: 'macOS Sonoma, Python 3.12, Node 22'
    validations:
      required: true
