name: 'RELEASE WORKFLOW'

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Changesets Release Orchestration
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. CHECKOUT
      # ==========================================

      - name: Checkout Source Context
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ==========================================
      # 2. NODE RUNTIME
      # ==========================================

      - name: Setup Node Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ==========================================
      # 3. PNPM
      # ==========================================

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          run_install: false

      # ==========================================
      # 4. PNPM CACHE
      # ==========================================

      - name: Configure PNPM Cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # ==========================================
      # 5. DEPENDENCIES
      # ==========================================

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # ==========================================
      # 6. CHANGESETS
      # ==========================================

      - name: Create or Update Release Pull Request
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm infra:release:changeset:version:packages
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          pr-base-branch: main
          create-github-releases: true
          push-git-tags: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
