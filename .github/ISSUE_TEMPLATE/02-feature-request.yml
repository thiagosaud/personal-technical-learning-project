name: '🚀 Feature Request'
description: 'Propose a new capability, engineering improvement, analytical model, or architecture evolution.'
title: '[FEATURE] '
labels:
  - enhancement
  - triage
body:
  - type: markdown
    attributes:
      value: |
        ## 🚀 Feature Request

        Use this form to propose a new capability, architectural improvement,
        machine learning experiment, developer-experience enhancement, or
        repository automation improvement.

        Proposals should describe the problem first and the proposed solution second.

  - type: checkboxes
    id: preflight
    attributes:
      label: 'Pre-submission checks'
      description: 'Confirm the proposal has been reviewed before submission.'
      options:
        - label: 'I searched existing issues and did not find an existing proposal covering the same requirement.'
          required: true
        - label: 'I have reviewed the repository documentation relevant to this proposal.'
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 'Problem Statement'
      description: 'Describe the limitation, inefficiency, missing capability, or engineering problem.'
      placeholder: |
        What problem are you trying to solve?

        Example:
        The current machine learning case does not provide an isolated evaluation
        workflow using unseen data, making model generalization difficult to analyze.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 'Proposed Solution'
      description: 'Describe the capability or implementation you propose and its expected behavior.'
      placeholder: |
        Describe the proposed solution.

        Include architectural changes, interfaces, workflows, data contracts,
        automation, or model behavior when relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 'Alternatives Considered'
      description: 'Describe alternative approaches that were evaluated and why they were not selected.'
      placeholder: |
        List alternative solutions, tools, architectures, algorithms, or workflows considered.
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: 'Engineering Impact'
      description: 'Describe expected impact on architecture, performance, security, maintainability, cost, or developer experience.'
      placeholder: |
        Consider:
        - Architecture
        - Performance
        - Security
        - Maintainability
        - Developer experience
        - CI/CD
        - Operational cost
        - Backward compatibility
    validations:
      required: false

  - type: checkboxes
    id: security
    attributes:
      label: 'Security & Governance'
      options:
        - label: 'I have considered the repository SECURITY.md requirements and identified no known security conflict.'
          required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: 'Contribution Intent'
      options:
        - label: 'I am willing to contribute implementation, testing, documentation, or validation if the proposal is accepted.'
          required: false
