# Semgrep Global Enterprise SAST Configuration Matrix
# Reference: https://semgrep.dev

rules:
  - id: python-insecure-deserialization-pickle
    pattern: pickle.loads(...)
    message: "❌ [SEMGREP SECURITY] Insecure 'pickle.loads' detected. Untrusted pickle files can cause Remote Code Execution (RCE). Use secure data serialization alternatives like Safetensors, JSON, ONNX, or Joblib with verified origins."
    languages: [python]
    severity: ERROR

  - id: generic-hardcoded-high-entropy-secret
    patterns:
      - pattern-either:
          - pattern: $SECRET = "..."
      - pattern-regex: (?i)(password|secret|passwd|api_key|token|private_key)\s*=\s*['"][a-zA-Z0-9-_\.\~]{16,}['"]
    message: '❌ [SEMGREP SECURITY] Potential hardcoded security token or credential detected. Move values out of the code engine into a protected environment wrapper (.env or Vault).'
    languages: [python, javascript, typescript]
    severity: ERROR

  - id: ml-scikit-learn-insecure-load
    pattern: joblib.load(...)
    message: '⚠️ [SEMGREP WARNING] Deserializing binary model artifacts via joblib can execute malicious code payloads. Ensure the source data stream is fully cryptographic-signed.'
    languages: [python]
    severity: WARNING
