name: '💬 Support Request & Questions'
description: 'Seek assistance regarding workspace installation, local tooling, or developer environment setup'
body:
  - type: markdown
    attributes:
      value: '### Developer Technical Assistance Request'

  - type: textarea
    id: context
    attributes:
      label: 'What part of the monorepo ecosystem are you struggling with?'
      placeholder: 'Provide complete context (e.g., Local Docker execution via Act fails during node module provisioning)...'
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 'Console Logs or Stack Traces'
      placeholder: 'Paste any relevant terminal error text or logs here...'
      render: bash
