[project]
name = "case-shakespeare"
version = "1.0.0"
description = "Deep Learning for Shakespeare Text Generation project"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "THIAGO SAUD", email = "126628718+thiagosaud@users.noreply.github.com" },
]

# Dedicated third-party data science frameworks isolated strictly within this project context
dependencies = [
    "gradio>=6.26.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "tensorboard>=2.17.0",
    "tensorflow>=2.21.0",
]

[dependency-groups]
dev = []

# Maps the CLI entrypoint dynamically to the package orchestration layer
[project.scripts]
case-shakespeare = "src.app.cli:main"

# Leverages the fast Rust-backed Hatchling packaging engine natively integrated with uv
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Maps the specific target source directory to prevent global namespace collisions
packages = ["src"]

[tool.ruff]
extend = "../../../../../pyproject.toml"
src = ["src"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ============================================================
# LOCAL SUBPROJECT PYTEST INTEGRATION MATRIX
# ============================================================
[tool.pytest.ini_options]
# Explicitly registers both the base and source paths to protect absolute and relative import hooks
pythonpath = [".", "src"]
testpaths = ["tests"]
