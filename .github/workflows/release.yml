name: Monorepo Automated Release Architecture

on:
  push:
    branches: [main]

permissions:
  contents: write # Required to create git tags, releases and push version bumps

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  automated_release:
    name: Track Changesets & Orchestrate Release Cycle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Context
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Enforces full git history for automated tagging pipelines

      - name: Setup Node Runtime (Stable LTS Layer)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache PNPM Store Layout
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Enable Corepack & Pre-fetch Pinned Package Manager
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate

      - name: Provision Node Packages
        run: pnpm install --frozen-lockfile

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Performs versioning using the package.json script directly in the main.
      - name: Execute Direct Versioning Pipeline
        run: pnpm run changeset:version:packages

      # Checks if the changesets generated version changes.
      - name: Check for Version Updates
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changesets found to version."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Version updates detected."
          fi

      # Commits and sends version and changelog changes directly to the main branch.
      - name: Push Version Bumps to Main
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git add .
          git commit -m "chore(release): bump package versions and compile changelogs [skip ci]"
          git push origin main

      # Creates GitHub Release and Tag pointing to the updated version commit.
      - name: Create GitHub Release and Tag
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: pnpm run release:github
