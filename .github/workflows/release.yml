name: Monorepo Automated Release Architecture

on:
  push:
    branches:
      - release
      - 'release/**'

permissions:
  contents: write # Required to create git tags, releases and push version bumps

concurrency:
  group: release-branch
  cancel-in-progress: false

jobs:
  automated_release:
    name: Track Changesets & Orchestrate Release Cycle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Context
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Enforces full git history for automated tagging pipelines
          ref: ${{ github.ref_name }}

      # LOOP PROTECTION: Checks if the commit that triggered the push was made by the bot itself.
      - name: Guard Against Bot Commit Loops
        id: check_bot_commit
        run: |
          LAST_COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          echo "Last commit message: $LAST_COMMIT_MSG"

          if [[ "$LAST_COMMIT_MSG" =~ ^chore\(release\): ]]; then
            echo "is_bot_commit=true" >> $GITHUB_OUTPUT
            echo "Skipping release: The last commit was generated by the release bot."
          else
            echo "is_bot_commit=false" >> $GITHUB_OUTPUT
            echo "Proceeding with release pipeline..."
          fi

      - name: Setup Node Runtime (Stable LTS Layer)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache PNPM Store Layout
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Enable Corepack & Pre-fetch Pinned Package Manager
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate

      - name: Provision Node Packages
        run: pnpm install --frozen-lockfile

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Wait for CI Verification Success
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting for CI checks to pass on commit ${{ github.sha }}..."
          while true; do
            STATUS=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs --jq '.check_runs[] | select(.name != "Track Changesets & Orchestrate Release Cycle") | .conclusion')

            if echo "$STATUS" | grep -q "null"; then
              echo "CI checks still running, waiting 10 seconds..."
              sleep 10
              continue
            fi

            if echo "$STATUS" | grep -q "failure"; then
              echo "❌ CI checks failed! Aborting release."
              exit 1
            fi

            echo "✅ All CI checks passed successfully!"
            break
          done

      # Performs versioning using the package.json script directly.
      - name: Execute Direct Versioning Pipeline
        if: steps.check_bot_commit.outputs.is_bot_commit == 'false'
        run: pnpm run changeset:version:packages

      # Checks if the changesets generated version changes.
      - name: Check for Version Updates
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changesets found to version."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Version updates detected."
          fi

      # Commits and sends version and changelog changes back to the origin branch dynamically.
      - name: Push Version Bumps to Release Branch
        if: steps.check_changes.outputs.has_changes == 'true' && steps.check_bot_commit.outputs.is_bot_commit == 'false'
        env:
          LEFTHOOK: '0'
        run: |
          git add .
          git commit -m "chore(release): bump package versions and compile changelogs [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}

      # Creates GitHub Release and Tag pointing to the updated version commit.
      - name: Create GitHub Release and Tag
        if: steps.check_changes.outputs.has_changes == 'true' && steps.check_bot_commit.outputs.is_bot_commit == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: pnpm run release:github
