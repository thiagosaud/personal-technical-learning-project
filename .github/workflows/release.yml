name: Monorepo Automated Release Architecture

on:
  push:
    branches: [main]

permissions:
  contents: write # Required to create git tags, releases and push version bumps
  pull-requests: write # Required for Changesets to open the automated release PR

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  automated_release:
    name: Track Changesets & Orchestrate Release Cycle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Context
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Enforces full git history for automated tagging pipelines

      - name: Setup Node Runtime (Stable LTS Layer)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache PNPM Store Layout
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Enable Corepack & Pre-fetch Pinned Package Manager
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate

      - name: Provision Node Packages
        run: pnpm install --frozen-lockfile

      # If changesets exist, this action opens or updates the Version Packages PR.
      # Package publishing is intentionally not configured because this monorepo
      # does not define a registry publish command.
      - name: Execute Automated Versioning Pipeline
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm run changeset:version:packages
          commit-message: 'chore(release): bump package versions and compile changelogs [skip ci]'
          pr-title: 'Version Packages'

      - name: Create GitHub Release and Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: pnpm run release:github
