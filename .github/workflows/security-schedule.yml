name: 'SECURITY SCHEDULE WORKFLOW'

on:
  schedule:
    # 0 2 * * 4 -> Minute 0, Hour 2 (UTC), Every day of month, Every month, 4 = Thursday.
    # Note: Workflows triggered by 'schedule' strictly execute ONLY on the default branch (main).
    - cron: '0 2 * * 4'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly_security_scan:
    name: Deep Vulnerability Scan Execution
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. ENVIRONMENT
      # ==========================================

      - name: Checkout Source Context
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Node Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack & Pre-fetch Pinned Package Manager
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate
          pnpm --version

      - name: Configure PNPM Cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Provision Node Packages
        run: pnpm infra:install:global:workspace:dependencies

      # ==========================================
      # 2. PYTHON SECURITY TOOLCHAIN
      # ==========================================

      - name: Setup UV Environment Tooling
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: latest

      - name: Sync Global Root Development Tools
        env:
          UV_LINK_MODE: copy
        run: pnpm infra:install:global:python:dependencies

      # ==========================================
      # 3. SAST GATES
      # ==========================================

      - name: Run Full SAST Security Matrix
        run: pnpm test:sast:all

      # ==========================================
      # 4. QUALITY
      # ==========================================

      - name: Execute Unified Monorepo Quality Matrix Verification
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          COMMIT_FROM_SHA: ${{ github.event.pull_request.base.sha }}
          COMMIT_TO_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm lint:check:all

      # ==========================================
      # 5. TESTS
      # ==========================================

      - name: Run Python Automated Unit Tests Suite
        run: pnpm test:unit:py
