name: 'CI WORKFLOW'

on:
  pull_request:
    branches:
      - main

  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  monorepo_quality_matrix:
    name: Monorepo Quality Matrix & Integration Verification
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. ENVIRONMENT SOURCE PROVISIONING
      # ==========================================

      - name: Checkout Source Context
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Node Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack & Pre-fetch Pinned Package Manager
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate
          pnpm --version

      - name: Configure PNPM Cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Provision Node Packages
        run: pnpm infra:install:global:workspace:dependencies

      # ==========================================
      # 2. PYTHON ECOSYSTEM
      # ==========================================

      - name: Setup UV Environment Tooling
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: latest

      - name: Sync Global Root Development Tools
        env:
          UV_LINK_MODE: copy
        run: pnpm infra:install:global:python:dependencies

      # ==========================================
      # 3. SAST GATES
      # ==========================================

      - name: Run Full SAST Security Matrix
        run: pnpm test:sast:all

      # ==========================================
      # 4. QUALITY GATES
      # ==========================================

      - name: Execute Unified Monorepo Quality Matrix Verification
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          COMMIT_FROM_SHA: ${{ github.event.pull_request.base.sha }}
          COMMIT_TO_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm lint:check:all

      # ==========================================
      # 5. UNIT TESTS
      # ==========================================

      - name: Run Python Automated Unit Tests Suite
        run: pnpm test:unit:py
