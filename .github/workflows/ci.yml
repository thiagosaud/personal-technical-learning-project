name: Monorepo Production Integration Verification Engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  security_and_compliance:
    name: Compliance & Core Guardrails Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Context
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node Runtime (Stable LTS Layer)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache PNPM Store Layout
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Enable Corepack & Pre-fetch Pinned Package Manager
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate

      - name: Provision Node Packages
        run: pnpm install --frozen-lockfile

      - name: Run Gitleaks Engine Audit
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Node Standard Compliance Checks
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          pnpm run lint:branch:ci

      - name: Run Markdown Compliance Checks
        run: pnpm run lint:markdown

  code_analytics_and_quality:
    name: Code Quality & Advanced Security Sweeps
    runs-on: ubuntu-latest
    needs: security_and_compliance
    steps:
      - name: Checkout Source Context
        uses: actions/checkout@v4

      - name: Setup Node Runtime (Stable LTS Layer)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache PNPM Store Layout
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Enable Corepack & Pre-fetch Pinned Package Manager
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate

      - name: Provision Node Packages
        run: pnpm install --frozen-lockfile

      - name: Validate Configurations Layout (Prettier)
        run: pnpm run lint:code:js

      - name: Setup UV Environment Tooling
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: 'latest'

      - name: Sync Global Root Development Tools
        run: uv sync --frozen

      - name: Execute SAST Scans and Linters
        run: |
          pnpm run lint:code:py
          pnpm run lint:security:py
          pnpm run lint:security:semgrep

      - name: Run Python Automated Unit Tests Suite
        run: pnpm run test:py
