name: 'RELEASE WORKFLOW'

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Changesets Release Orchestration
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. CHECKOUT
      # ==========================================

      - name: Checkout Source Context
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ==========================================
      # 2. NODE + PNPM
      # ==========================================

      - name: Enable Corepack & Configure PNPM
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate
          pnpm --version

      - name: Setup Node Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # ==========================================
      # 3. DEPENDENCIES
      # ==========================================

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # ==========================================
      # 4. CHANGESETS
      # ==========================================

      - name: Create or Update Changesets Release PR
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm infra:release:changeset:version:packages
          publish-script: pnpm infra:release:changeset:publish:packages
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          pr-base-branch: main
          create-github-releases: true
          push-git-tags: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
