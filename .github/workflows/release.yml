name: 'RELEASE AND TAG AUTOMATION WORKFLOW'

on:
  workflow_run:
    workflows:
      - 'CI WORKFLOW'
    types:
      - completed

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-automation
  cancel-in-progress: false

jobs:
  automated_release:
    name: Track Changesets & Orchestrate Release Cycle
    runs-on: ubuntu-latest

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'

    steps:
      # ==========================================
      # 1. CHECKOUT
      # ==========================================

      - name: Checkout Source Context
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ==========================================
      # 2. DISCOVER SOURCE PR
      # ==========================================

      - name: Resolve Release Pull Request
        id: release_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          PR_NUMBER="$(
            gh api \
              "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/pulls" \
              --jq '.[0].number'
          )"

          if [ -z "$PR_NUMBER" ]; then
            echo "No Pull Request associated with workflow run."
            exit 0
          fi

          HEAD_REF="$(
            gh pr view "$PR_NUMBER" \
              --json headRefName \
              --jq '.headRefName'
          )"

          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "head_ref=${HEAD_REF}" >> "$GITHUB_OUTPUT"

          echo "PR: #${PR_NUMBER}"
          echo "Branch: ${HEAD_REF}"

      # ==========================================
      # 3. RELEASE BRANCH GATE
      # ==========================================

      - name: Validate Release Branch
        if: steps.release_pr.outputs.pr_number != ''
        shell: bash
        run: |
          HEAD_REF="${{ steps.release_pr.outputs.head_ref }}"

          if [[ ! "$HEAD_REF" =~ ^release/[a-z0-9.-]+$ ]]; then
            echo "Not a release branch: $HEAD_REF"
            exit 0
          fi

          echo "Release branch validated: $HEAD_REF"

      # ==========================================
      # 4. CHECK IDEMPOTENCY
      # ==========================================

      - name: Check Existing Release State
        id: release_state
        if: steps.release_pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.release_pr.outputs.pr_number }}
        shell: bash
        run: |
          echo "Inspecting PR #${PR_NUMBER}..."

          MODIFIED_FILES="$(
            gh pr view "$PR_NUMBER" \
              --json files \
              --jq '.files[].path'
          )"

          if echo "$MODIFIED_FILES" | grep -Eq '(^|/)(package.json|CHANGELOG.md|pnpm-lock.yaml)$'; then
            echo "already_versioned=true" >> "$GITHUB_OUTPUT"

            echo "Release state already detected."
            echo "Version/changelog artifacts are already present."
          else
            echo "already_versioned=false" >> "$GITHUB_OUTPUT"

            echo "No release artifacts detected."
          fi

      # ==========================================
      # 5. CONFIGURE GIT
      # ==========================================

      - name: Configure Git Identity
        if: >
          steps.release_pr.outputs.pr_number != '' &&
          steps.release_state.outputs.already_versioned == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ==========================================
      # 6. NODE
      # ==========================================

      - name: Setup Node Runtime
        if: >
          steps.release_pr.outputs.pr_number != '' &&
          steps.release_state.outputs.already_versioned == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack & Pre-fetch Pinned Package Manager
        if: >
          steps.release_pr.outputs.pr_number != '' &&
          steps.release_state.outputs.already_versioned == 'false'
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate
          pnpm --version

      - name: Configure PNPM Cache
        if: >
          steps.release_pr.outputs.pr_number != '' &&
          steps.release_state.outputs.already_versioned == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # ==========================================
      # 7. DEPENDENCIES
      # ==========================================

      - name: Provision Node Packages
        if: >
          steps.release_pr.outputs.pr_number != '' &&
          steps.release_state.outputs.already_versioned == 'false'
        run: pnpm infra:install:global:workspace:dependencies

      # ==========================================
      # 8. VERSIONING
      # ==========================================

      - name: Execute Changesets Version Pipeline
        if: >
          steps.release_pr.outputs.pr_number != '' &&
          steps.release_state.outputs.already_versioned == 'false'
        run: pnpm infra:release:changeset:version:packages

      # ==========================================
      # 9. DETECT CHANGES
      # ==========================================

      - name: Check for Version Updates
        id: check_changes
        if: >
          steps.release_pr.outputs.pr_number != '' &&
          steps.release_state.outputs.already_versioned == 'false'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No version changes generated."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Version changes detected."
            git status --short
          fi

      # ==========================================
      # 10. COMMIT + PUSH
      # ==========================================

      - name: Commit Version Updates
        if: >
          steps.check_changes.outputs.has_changes == 'true'
        shell: bash
        env:
          LEFTHOOK: '0'
        run: |
          git add -A
          git commit \
            -m "chore(release): version packages"

      - name: Push Version Updates
        if: >
          steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ steps.release_pr.outputs.head_ref }}
        shell: bash
        run: |
          git push origin "HEAD:${HEAD_REF}"

      # ==========================================
      # 11. TAG + GITHUB RELEASE
      # ==========================================

      - name: Create GitHub Release and Tag
        if: >
          steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm infra:script:release:github
