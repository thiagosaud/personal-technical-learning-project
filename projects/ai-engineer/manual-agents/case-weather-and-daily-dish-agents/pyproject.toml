[project]
name = "case-weather-and-daily-dish-agents"
version = "1.0.0"
description = "Educational implementation of AI agents from scratch including weather, daily dish menu retrieval, and router logic using Python."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "THIAGO SAUD", email = "126628718+thiagosaud@users.noreply.github.com" },
]

# Dedicated third-party data science frameworks isolated strictly within this project context
dependencies = [
    "nltk>=3.10.3",
    "numpy>=2.5.2",
    "pypdf>=6.19.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = []

# Maps the CLI entrypoint dynamically to the package orchestration layer
[project.scripts]
case-byd = "src.main:main"

# Leverages the fast Rust-backed Hatchling packaging engine natively integrated with uv
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Maps the specific target source directory to prevent global namespace collisions
packages = ["src"]

[tool.ruff]
extend = "../../../../pyproject.toml"
src = ["src"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ============================================================
# LOCAL SUBPROJECT PYTEST INTEGRATION MATRIX
# ============================================================
[tool.pytest.ini_options]
# Explicitly registers both the base and source paths to protect absolute and relative import hooks
pythonpath = ["src"]
testpaths = ["tests"]
