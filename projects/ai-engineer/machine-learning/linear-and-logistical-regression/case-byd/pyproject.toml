[project]
name = "case-byd"
version = "0.1.0"
description = "Machine Learning ETL and Modeling Layer for BYD Technical Vehicle specs"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "THIAGO SAUD", email = "126628718+thiagosaud@users.noreply.github.com" },
]

dependencies = [
    "adjusttext>=1.4.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "threadpoolctl>=3.5.0",
]

[dependency-groups]
dev = []

# Define o comando CLI local para executar o pipeline de machine learning direto via terminal
[project.scripts]
case-byd = "src.main:main"

# Utiliza o moderno e ultra-rápido motor de build nativo da Astral para empacotamento
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
extend = "../../../../../pyproject.toml"
src = ["src"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
